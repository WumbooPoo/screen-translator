# Builds the debug APK on every push to main and uploads it
# as a workflow artifact (screen-translator-debug-apk).
#
# NOTE: AGP 9 removed ABI splits, so there is no per-ABI assemble task
# anymore — the build produces one universal debug APK (native libs are
# limited to arm64-v8a + armeabi-v7a via ndk abiFilters in
# app/build.gradle.kts).
#
# NOTE: this project has no Gradle Wrapper jar committed yet (the wrapper
# jar is binary and cannot be pushed through the GitHub connector), so CI
# provisions Gradle 9.6.0 directly via gradle/actions/setup-gradle and
# runs `gradle` instead of `./gradlew`. The pinned version matches
# gradle/wrapper/gradle-wrapper.properties. Once a wrapper jar exists in
# the repo (generate it with `gradle wrapper` on a machine where Gradle
# runs, e.g. inside Android Studio), switch the build step back to
# `./gradlew assembleDebug`.

name: Android Debug Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-translator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
