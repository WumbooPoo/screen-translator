[versions]
# Toolchain — verified 2026-11-15 against Maven metadata / official docs.
agp = "9.5.1"               # latest stable; requires Gradle 9.6.0, JDK 17, max API 37
kotlin = "2.4.21"           # latest stable (2.5.0 is still RC)
gradle = "9.6.0"            # minimum required by AGP 9.5
composeBom = "2026.09.00"   # latest Compose BOM
coreKtx = "1.19.1"
activityCompose = "1.13.0"

# On-device inference
onnxruntime = "1.32.0"     # com.microsoft.onnxruntime:onnxruntime-android, Maven Central
litert = "2.3.2"            # com.google.ai.edge.litert, Google Maven, latest 2026-10-26

# ML Kit — UNBUNDLED Play-services variants (zero APK weight; models download via Play services)
mlkitTextRecognition = "19.0.2"
mlkitTextRecognitionJapanese = "16.0.2"
mlkitTranslate = "17.0.3"
mlkitLanguageId = "17.0.6"

# Networking (downloads + LibreTranslate)
retrofit = "2.12.0"
okhttp = "4.12.0"

# Coroutines Play-services bridge — must match the kotlinx-coroutines-core
# version Compose runtime pulls in (1.9.0 for Compose 1.12.1).
coroutinesPlayServices = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# Coroutines Play-services bridge: kotlinx.coroutines.tasks.await() used by
# the ML Kit code (MlKitOcr / MlKitTranslator / MlKitRegionProvider).
# NOT brought in transitively by ML Kit or Compose, so it must be declared.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }

onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
litert-gpu = { group = "com.google.ai.edge.litert", name = "litert-gpu", version.ref = "litert" }

mlkit-text-recognition = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-japanese = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-japanese", version.ref = "mlkitTextRecognitionJapanese" }
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
mlkit-language-id = { group = "com.google.mlkit", name = "language-id", version.ref = "mlkitLanguageId" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
